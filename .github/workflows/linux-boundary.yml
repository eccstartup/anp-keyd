name: Linux boundary acceptance
on:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'deploy/linux/**'
      - 'Cargo.*'
      - '.github/workflows/linux-boundary.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'deploy/linux/**'
      - 'Cargo.*'
      - '.github/workflows/linux-boundary.yml'
permissions:
  contents: read
jobs:
  multi-uid:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build and test disposable service/admin/Agent domains
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/src:ro" -w /src
          rust:1.90-bookworm@sha256:3914072ca0c3b8aad871db9169a651ccfce30cf58303e5d6f2db16d1d8a7e58f
          bash deploy/linux/test-container.sh
