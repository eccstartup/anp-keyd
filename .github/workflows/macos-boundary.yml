name: macOS local boundary preview
on:
  push:
    paths: ['src/**', 'tests/**', 'deploy/macos/**', 'Cargo.*', '.github/workflows/macos-boundary.yml']
  pull_request:
    paths: ['src/**', 'tests/**', 'deploy/macos/**', 'Cargo.*', '.github/workflows/macos-boundary.yml']
permissions:
  contents: read
jobs:
  local-preview:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Installer identity policy (no host changes)
        run: python3 -m unittest discover -s deploy/macos -p 'test_install.py'
      - name: Regression tests
        env:
          RUST_LOG: info
        run: cargo test --locked --features mcp
      - name: Strict lint
        run: cargo clippy --locked --all-targets --features mcp -- -D warnings
      - name: Local release stays preview
        run: |
          cargo build --locked --release --features mcp
          target/release/anp-keyd build-info | python3 -c 'import json,sys; i=json.load(sys.stdin); assert i["release"] and not i["protected_supported"] and not i["seed_export"] and not i["hardware_software"]'
